<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Moodify{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('main.home') }}">♪ Moodify</a>
    <span class="stage-label">Kerangka belajar</span>
  </header>
  <main class="page-content">{% block content %}{% endblock %}</main>
  <footer class="site-footer">Tahap awal · hasil pencarian masih menggunakan data contoh</footer>
</body>
</html>
